<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Carregando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Carregando</title>

  <!-- Centro do desenho no meio do viewBox -->
  <g transform="translate(50 50)">

    <!-- Giro contínuo: 60° bate com a simetria do asterisco, então o loop não "pula" -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0;60" dur="2.8s" repeatCount="indefinite" />

      <!-- Expande e retrai -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="0.35;1;0.35" keyTimes="0;0.5;1"
          calcMode="spline" keySplines="0.35 0 0.45 1;0.35 0 0.55 1"
          dur="2.8s" repeatCount="indefinite" />

        <!-- Os 3 traços que formam as 6 pontas -->
        <g stroke="#38b6ff" stroke-width="12" stroke-linecap="round" fill="none">
          <line x1="0" y1="-34" x2="0" y2="34" />
          <line x1="0" y1="-34" x2="0" y2="34" transform="rotate(60)" />
          <line x1="0" y1="-34" x2="0" y2="34" transform="rotate(120)" />
        </g>
      </g>
    </g>

  </g>
</svg>
